services:
  app:
    build:
      context: .
      # Only remaps the container user's uid/gid on top of the base image so that
      # files written inside the container belong to the host user.
      # On Linux set PUID/PGID in .env when your uid is not 1000; macOS needs nothing.
      dockerfile_inline: |
        FROM ghcr.io/zhaojiannet/dev-go:1.27.1
        ARG PUID
        ARG PGID
        USER root
        RUN fix-user "$$PUID" "$$PGID"
        USER go
      args:
        PUID: ${PUID:-1000}
        PGID: ${PGID:-1000}
    init: true
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Tokyo}
    volumes:
      # cclayer is a CLI with go.mod at the repository root, so the whole
      # repository is mounted instead of an app/ subdirectory.
      - .:/app
      - go-mod:/go/pkg/mod
      - go-build:/go/cache

volumes:
  # Shared by every Go project on this machine: modules download once,
  # the build cache hits across projects.
  go-mod:
    name: go-mod
  go-build:
    name: go-build
